name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Build & sign release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "${ANDROID_HOME:-/nonexistent}" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testReleaseUnitTest --console=plain --stacktrace 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface compiler/dependency errors as check annotations: job logs are not
            # readable without repository admin rights, annotations are.
            grep -E "^(e: |FAILURE:|> Task .* FAILED|Could not resolve|Could not find|\\* What went wrong:|Caused by: )" unit-tests.log | head -40 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done
            python3 tools/report-test-failures.py
            exit "$status"
          fi

      - name: Require release signing secrets
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name. Run tools/setup-signing.sh to create the keystore and upload the secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore release keystore
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mangaos-release.jks"
          {
            echo "MANGAOS_KEYSTORE_PATH=$RUNNER_TEMP/mangaos-release.jks"
            echo "MANGAOS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MANGAOS_KEY_ALIAS=$KEY_ALIAS"
            echo "MANGAOS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Keystore restored ($(stat -c%s "$RUNNER_TEMP/mangaos-release.jks") bytes)."
          mkdir -p artifacts
          {
            echo "Package name: com.mangaos.app"
            keytool -list -v -keystore "$RUNNER_TEMP/mangaos-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "SHA1:|SHA256:"
          } > artifacts/signing-fingerprints.txt
          cat artifacts/signing-fingerprints.txt

      - name: Build signed release APKs
        run: |
          set +e
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee release-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(e: |FAILURE:|> Task .* FAILED|Could not resolve|Could not find|\\* What went wrong:|Caused by: )" release-build.log | head -40 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done
            exit "$status"
          fi

      - name: Verify signatures
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ls -la app/build/outputs/apk/release/
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Collect artifacts
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p artifacts/arm64-v8a artifacts/armeabi-v7a
          count=0
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk"
            name=$(basename "$apk")
            case "$name" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *) echo "::error title=Unexpected APK::${name} is not an ABI split"; exit 1 ;;
            esac
            cp "$apk" "artifacts/${abi}/MangaOS-${SHORT_SHA}-${name}"
            count=$((count + 1))
          done
          if [ "$count" -ne 2 ]; then
            echo "::error title=ABI splits::Expected exactly 2 ABI APKs, found $count"
            exit 1
          fi
          sha256sum artifacts/arm64-v8a/* artifacts/armeabi-v7a/* | tee artifacts/checksums-sha256.txt

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: mangaos-arm64-v8a-${{ github.sha }}
          path: artifacts/arm64-v8a/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: mangaos-armeabi-v7a-${{ github.sha }}
          path: artifacts/armeabi-v7a/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: mangaos-checksums-${{ github.sha }}
          path: artifacts/checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore and signing environment
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mangaos-release.jks"
          echo "Keystore removed from the runner."
